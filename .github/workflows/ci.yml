name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - run: ruff check .
      - run: python -m compileall -q src tests

  docker-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: docker pull alpine:3.20
      - run: docker network create --internal pentestng-ci
      - name: Run Docker isolation integration tests
        env:
          PENTESTNG_DOCKER_INTEGRATION: "1"
        run: pytest -q tests/integration/test_docker_runtime.py
      - if: always()
        run: docker network rm pentestng-ci || true
