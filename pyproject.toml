[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pentestgpt-ng"
version = "0.1.0"
description = "Authorized, evidence-driven AI pentesting framework core"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0.1,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "ruff>=0.5,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pentestng"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "docker_integration: requires a working Docker daemon",
]

[tool.ruff]
target-version = "py311"
line-length = 100
